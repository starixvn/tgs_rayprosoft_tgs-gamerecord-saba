apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gamerecord-saba-manualservice.name" . }}
  namespace: {{ .Values.namespace }}
data:
  appsettings.json: |
    {
      "GameRecordInfo": {
        "GameProviderCode": "SABATF",
        "VersionKey": 0,
        "LockMinute": 10,
        "MongoDefine": "gp.gamerecord.database.manual",
        "MongoGlobPattern": "tgs.gp.gamerecord.database.manual.sabatf",
        "GameExternalId": "sports_book"
      },
      "NatsSetting": {
        "Queue": "gp.gamerecord.manual",
        "Subject": "gp.gamerecord.manual.sabatf"
      },
      "GameRecord": {
         "GameCommandClientBaseUrl": "http://game-gamecommand/",
         "GameInterfaceBaseUrl": "http://game-gameinterface-saba-service:9090/",
         "GameRecordSchedulesBaseUrl": "http://game-gamerecordschedules:9090/"
      }
    }
  monitor.settings.json: |
    {
      "Metrics": {
        "MetricCount": "1"
      },
      "Logging":{
        "Console": {
          "FormatterName": "json"
        },
        "LogLevel": {
          "Default": "Warning",
          "Microsoft": "Warning",
          "Microsoft.Diagnostics": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        }
      }
    }
