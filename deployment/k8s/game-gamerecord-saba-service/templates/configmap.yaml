apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gamerecord-saba-service.name" . }}
  namespace: {{ .Values.namespace }}
data:
  appsettings.json: |
    {
      "GameRecordInfo": {
        "GameProviderCode": "SABATF",
        "VersionKey": 0,
        "LockMinute": 10,
        "MongoDefine": "gp.gamerecord.database",
        "MongoGlobPattern": "tgs.gp.gamerecord.database.round.sabatf",
        "GameExternalId": "sports_book"
      },
      "NatsSetting": {
        "Group": "gp.gamerecord.schedule",
        "Subject": "gp.gamerecord.schedule.sabatf"
      },
      "GameRecord": {
         "GameProvidersQueryServerBaseUrl": "http://game-gameprovider-queryserver/",
         "GameInterfaceBaseUrl": "http://game-gameinterface-sbab-service:9090/",
         "GameRecordSchedulesBaseUrl": "https://game-gamerecordschedules:9090/"
      }
    }
  monitor.settings.json: |
    {
      "Metrics": {
        "MetricCount": "1"
      },
      "Logging":{
        "Console": {
          "FormatterName": "json"
        },
        "LogLevel": {
          "Default": "Warning",
          "Microsoft": "Warning",
          "Microsoft.Diagnostics": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        }
      }
    }
