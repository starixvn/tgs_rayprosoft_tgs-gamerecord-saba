apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gamerecord-saba-service.name" . }}
  namespace: {{ .Values.namespace }}
data:
  appsettings.json: |
    {
      "GameRecordInfo": {
        "GameProviderCode": "SABATF",
        "GameExternalId": "sports_book",
        "VersionKey": 0,
        "LockMinute": 10
      },
      "GameRecord": {
        "GameCommandClientBaseUrl": "http://game-gamecommand/",
        "GameInterfaceBaseUrl": "http://game-gameinterface-saba-service:9090/",
        "GameRecordSchedulesBaseUrl": "http://game-gamerecordschedules:9090/"
      }
    }
  monitor.settings.json: |
    {
      "Metrics": {
        "MetricCount": "1"
      },
      "Logging":{
        "Console": {
          "FormatterName": "json"
        },
        "LogLevel": {
          "Default": "Warning",
          "Microsoft": "Warning",
          "Microsoft.Diagnostics": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        }
      }
    }
